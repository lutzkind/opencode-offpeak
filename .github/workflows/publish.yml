name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    # npm is an optional channel. Enable only after the package and trusted publisher exist.
    if: vars.NPM_TRUSTED_PUBLISHING == 'enabled' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm pack --dry-run

      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              console.error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
              process.exit(1);
            }
          '

      - name: Publish with npm trusted publishing
        run: npm publish --access public --tag latest
